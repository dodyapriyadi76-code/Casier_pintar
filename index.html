<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14213d"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><title>Kasir Pintar</title>
<style>

@media(prefers-reduced-motion:reduce){.sh{animation:none}}
@media print{body{overflow:visible}body>*:not(#md){display:none!important}#md{position:static;background:none;display:block}.sh{box-shadow:none;max-width:none;animation:none}.np{display:none}}
.av,.lg{overflow:hidden}.av img,.lg img{width:100%;height:100%;object-fit:cover}.lp{width:68px;height:68px;border-radius:20px;font-size:28px;flex:none}

.tb{display:flex;gap:10px;align-items:center;margin-bottom:10px}.tb .bt{margin:0}
header{padding-top:calc(12px + env(safe-area-inset-top,0px))}nav{padding-bottom:env(safe-area-inset-bottom,0px)}#au{padding-top:calc(20px + env(safe-area-inset-top,0px))}
@media(min-width:760px){#app{max-width:560px;margin:0 auto;border-left:1px solid var(--bd);border-right:1px solid var(--bd)}}
.rc{font-size:15px;color:#111}.rc .c{text-align:center}.rc .rn{font-size:22px;margin:8px 0 4px;line-height:1.25}.rc .ln{border-top:2px dashed #666;margin:14px 0}.rc .rt{font-size:20px;margin:2px 0}.rc .tt{padding:2px 0}.rc svg{display:block;margin:0 auto}.rc .rl{max-height:90px;max-width:160px;margin:0 auto}
@media print{.rc{max-width:80mm;margin:0 auto;color:#000}}
</style></head><body>
<div id="au" class="off"><div class="ah"><div class="lg" id="lgo"></div><h1>Kasir Pintar</h1><p id="at"></p></div><form id="af" class="cd"></form></div>
<div id="app" class="off"><header><div class="av" id="hv"></div><div><b id="hn"></b><small id="hd"></small></div></header>
<main><section id="v-dash" class="v"></section><section id="v-pos" class="v"></section><section id="v-prod" class="v"></section><section id="v-hist" class="v"></section><section id="v-cfg" class="v"></section></main><nav id="nv"></nav></div>
<div id="md"><div class="sh" id="mc"></div></div><div id="ts"></div>
<script>
const $=s=>document.querySelector(s),K='kasir_pintar_v1',A=window.Android;
let S=null,cart=[],q='',fl=0,lk=0,sel=null;
const ic=p=>'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';
const I={dash:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
pos:'<circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 7H6"/>',
box:'<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3.3 7.5l8.7 5 8.7-5M12 22V12.5"/>',
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>'};
const T=[['dash','Dashboard'],['pos','Kasir'],['prod','Barang'],['hist','Riwayat'],['cfg','Konfigurasi']];
const rp=n=>'Rp'+Math.round(n).toLocaleString('id-ID'),P=id=>S.p.find(p=>p.id==id),day=t=>{const d=new Date(t);return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()};
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Data gagal disimpan. Memori HP mungkin penuh.')}};
const toast=m=>{const t=$('#ts');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2300)};
const hex=b=>Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join(''),rnd=()=>hex(crypto.getRandomValues(new Uint8Array(16)));
const hp=async(p,s)=>{const m=s+p;if(window.crypto&&crypto.subtle)return hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(m)));let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<m.length;i++){const c=m.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^a>>>16,2246822507)^Math.imul(b^b>>>13,3266489909);b=Math.imul(b^b>>>16,2246822507)^Math.imul(a^a>>>13,3266489909);return'f'+(4294967296*(2097151&b)+(a>>>0)).toString(16)};
const ctot=()=>cart.reduce((n,c)=>n+P(c.id).sell*c.q,0),num=id=>+($(id).value.replace(/\D/g,'')||0);
function openM(h){$('#mc').innerHTML=h;$('#md').classList.add('on')}function closeM(){$('#md').classList.remove('on')}
function authUI(){const set=!S;$('#au').classList.remove('off');$('#app').classList.add('off');$('#lgo').innerHTML=S&&S.cfg.logo?'<img alt="" src="'+S.cfg.logo+'">':ic(I.pos);
$('#at').textContent=set?'Buat akun toko Anda untuk mulai berjualan.':'Selamat datang kembali di '+S.cfg.name+'.';
$('#af').innerHTML=(set?'<label for="an">Nama toko</label><input id="an" maxlength="40" placeholder="Contoh: Toko Maju Jaya">':'')+'<label for="ap">Password</label><input id="ap" type="password" autocomplete="'+(set?'new-password':'current-password')+'">'+(set?'<label for="ac">Konfirmasi password</label><input id="ac" type="password" autocomplete="new-password">':'')+'<div id="ae" class="er"></div><button class="bt sf" type="submit">'+(set?'Buat akun dan masuk':'Masuk')+'</button>'}
$('#af').onsubmit=async e=>{e.preventDefault();const ae=$('#ae'),pw=$('#ap').value;ae.textContent='';try{
if(!S){const n=$('#an').value.trim();if(n.length<2)return void(ae.textContent='Nama toko minimal 2 karakter.');if(pw.length<6)return void(ae.textContent='Password minimal 6 karakter.');if(pw!==$('#ac').value)return void(ae.textContent='Konfirmasi password tidak sama.');const s=rnd();S={cfg:{name:n,s,h:await hp(pw,s)},p:[],s:[]};save();enter()}
else{if(Date.now()<lk)return void(ae.textContent='Terlalu banyak percobaan. Tunggu 30 detik.');if(await hp(pw,S.cfg.s)===S.cfg.h){fl=0;enter()}else{if(++fl>=5){lk=Date.now()+30000;fl=0}ae.textContent='Password salah.'}}}catch(x){ae.textContent='Terjadi kesalahan. Coba lagi.'}};
function enter(){$('#au').classList.add('off');$('#app').classList.remove('off');$('#nv').innerHTML=T.map(t=>`<button data-a="go" data-t="${t[0]}">${ic(I[{dash:'dash',pos:'pos',prod:'box',hist:'clock',cfg:'gear'}[t[0]]])}${t[1]}</button>`).join('');hdr();go('dash')}
function lock(){cart=[];closeM();authUI()}
function hdr(){$('#hv').innerHTML=S.cfg.logo?'<img alt="" src="'+S.cfg.logo+'">':esc(S.cfg.name.charAt(0).toUpperCase());document.title=S.cfg.name+' - Kasir Pintar';$('#hn').textContent=S.cfg.name;$('#hd').textContent=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function go(t){if(t!='prod')sel=null;document.querySelectorAll('.v').forEach(v=>v.classList.toggle('on',v.id=='v-'+t));document.querySelectorAll('#nv button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));$('main').scrollTop=0;({dash,pos,prod,hist,cfg})[t]()}
function dash(){const k=day(Date.now()),sum=a=>a.reduce((n,x)=>n+x.total,0),pr=a=>a.reduce((n,x)=>n+x.it.reduce((m,i)=>m+i[1]*(i[2]-i[3]),0),0);
const ts=S.s.filter(x=>day(x.t)==k),yd=new Date();yd.setDate(yd.getDate()-1);const y=sum(S.s.filter(x=>day(x.t)==day(yd))),tv=sum(ts),dl=y?Math.round((tv-y)/y*100):null,it=ts.reduce((n,x)=>n+x.it.reduce((m,i)=>m+i[1],0),0);
const ds=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return{l:d.toLocaleDateString('id-ID',{weekday:'short'}),v:sum(S.s.filter(x=>day(x.t)==day(d)))}}),mx=Math.max(...ds.map(d=>d.v),1);
const tp={};S.s.forEach(x=>x.it.forEach(i=>{tp[i[4]]=(tp[i[4]]||0)+i[1]}));const top=Object.entries(tp).sort((a,b)=>b[1]-a[1]).slice(0,5),tm=top.length?top[0][1]:1,low=S.p.filter(p=>p.stock<=5).sort((a,b)=>a.stock-b.stock).slice(0,5);
$('#v-dash').innerHTML=`<div class="hero"><small>Penjualan hari ini</small><div class="big">${rp(tv)}</div><div class="dl">${dl===null?'Belum ada pembanding dari kemarin':(dl>=0?'Naik ':'Turun ')+Math.abs(dl)+'% dari kemarin'}</div><div class="hs"><div><b>${ts.length}</b><small>Transaksi</small></div><div><b>${rp(pr(ts))}</b><small>Laba kotor</small></div><div><b>${it}</b><small>Barang terjual</small></div></div></div>
${S.p.length?'':'<div class="cd"><h3>Mulai dengan menambah barang</h3><p class="mu" style="margin:0">Daftarkan barang dagangan Anda dulu, lalu transaksi pertama siap dicatat.</p><button class="bt sf" data-a="go" data-t="prod">Tambah barang</button></div>'}
<div class="cd"><h3>Penjualan 7 hari terakhir</h3><svg viewBox="0 0 296 106" width="100%">${ds.map((d,i)=>{const h=Math.max(d.v/mx*72,d.v?4:2),x=i*40+8;return`<rect class="${i==6?'b1':'b0'}" x="${x}" y="${84-h}" width="24" height="${h}" rx="6"/><text class="sv" x="${x+12}" y="100" text-anchor="middle">${d.l}</text>`}).join('')}</svg></div>
<div class="cd"><h3>Barang terlaris</h3>${top.length?top.map(t=>`<div class="rw" style="display:block"><div class="rw" style="padding:0"><span>${esc(t[0])}</span><b>${t[1]} terjual</b></div><div class="bar" style="width:${t[1]/tm*100}%"></div></div>`).join(''):'<p class="mu" style="margin:0">Belum ada penjualan. Catat transaksi pertama di menu Kasir.</p>'}</div>
<div class="cd"><h3>Stok menipis</h3>${low.length?low.map(p=>`<div class="rw"><span>${esc(p.name)}</span><span class="tg ${p.stock<1?'r':'w'}">${p.stock<1?'Habis':'Sisa '+p.stock}</span></div>`).join(''):'<p class="mu" style="margin:0">Semua stok masih aman.</p>'}</div>`}
function pos(){$('#v-pos').innerHTML=`<div class="sb"><input id="sq" placeholder="Cari nama atau barcode" value="${esc(q)}">${A?'<button class="bt sm" data-a="scan">Scan</button>':''}</div><div id="pg" class="pg"></div><div id="cb"></div>`;grid();bar()}
function grid(){const k=q.toLowerCase(),L=S.p.filter(p=>!k||p.name.toLowerCase().includes(k)||(p.bc&&p.bc==q));$('#pg').innerHTML=L.length?L.map(p=>`<button class="pc${p.stock<1?' x':''}" data-a="add" data-i="${p.id}"><b>${esc(p.name)}</b><span>${rp(p.sell)}</span><small>Stok ${p.stock}</small></button>`).join(''):`<div class="em">${S.p.length?'Barang tidak ditemukan.':'Belum ada barang. Tambahkan di menu Barang.'}</div>`}
function bar(){const n=cart.reduce((a,c)=>a+c.q,0);$('#cb').innerHTML=n?`<button class="cbar" data-a="cart"><span>${n} barang</span><b>${rp(ctot())}</b><span>Bayar</span></button>`:''}
function add(id){const p=P(id),c=cart.find(x=>x.id==id);if(p.stock<1)return toast('Stok '+p.name+' habis');if(c){if(c.q>=p.stock)return toast('Stok tidak cukup');c.q++}else cart.push({id,q:1});bar()}
function cartM(){const t=ctot();openM(`<h3>Keranjang</h3>${cart.map(c=>{const p=P(c.id);return`<div class="ci"><div><b>${esc(p.name)}</b><small>${rp(p.sell)}</small></div><div class="qt"><button data-a="dec" data-i="${c.id}">−</button><span>${c.q}</span><button data-a="inc" data-i="${c.id}">+</button></div><b>${rp(p.sell*c.q)}</b></div>`}).join('')}<div class="tt" style="font-size:18px;margin-top:8px"><span>Total</span><b>${rp(t)}</b></div><label for="cash">Uang diterima</label><input id="cash" inputmode="numeric" placeholder="0"><div class="qk"><button data-a="qk" data-v="${t}">Uang pas</button><button data-a="qk" data-v="50000">50.000</button><button data-a="qk" data-v="100000">100.000</button></div><div class="tt" style="margin-top:8px"><span>Kembalian</span><b id="chg">Rp0</b></div><button class="bt sf" data-a="pay">Selesaikan transaksi</button>`)}
function pay(){const t=ctot(),cash=num('#cash');if(cash<t)return toast('Uang diterima kurang dari total');const s={id:'TRX-'+String(S.s.length+1).padStart(4,'0'),t:Date.now(),it:cart.map(c=>{const p=P(c.id);p.stock-=c.q;return[p.id,c.q,p.sell,p.buy,p.name]}),total:t,cash};S.s.push(s);save();cart=[];rcpt(s);if($('#v-pos').classList.contains('on')){grid();bar()}}
const n3=n=>Math.round(n).toLocaleString('en-US'),rr=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
function rcpt(s){const d=new Date(s.t),p2=x=>String(x).padStart(2,'0'),dt=d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()),tm=p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds()),tq=s.it.reduce((a,i)=>a+i[1],0);
const lg=S.cfg.logo?'<img class="rl" alt="" src="'+S.cfg.logo+'">':'<svg viewBox="0 0 24 24" width="76" height="76" fill="none" stroke="#111" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m2 7 4.4-4.4A2 2 0 0 1 7.8 2h8.4a2 2 0 0 1 1.4.6L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/><path d="M2 7h20v3a2 2 0 0 1-2 2 2.7 2.7 0 0 1-2-.6 2.7 2.7 0 0 1-3 0 2.7 2.7 0 0 1-3 0 2.7 2.7 0 0 1-3 0 2.7 2.7 0 0 1-2 .6 2 2 0 0 1-2-2z"/></svg>';
openM(`<div class="rc"><div class="c">${lg}<div class="rn">${esc(S.cfg.name)}</div>${S.cfg.addr?'<div>'+esc(S.cfg.addr)+'</div>':''}${S.cfg.tel?'<div>No. Telp '+esc(S.cfg.tel)+'</div>':''}</div><div class="ln"></div><div>${dt}<br>${tm}<br>No.${s.id}</div><div class="ln"></div>${s.it.map((i,k)=>`<div><b>${k+1}. ${esc(i[4])}</b></div><div class="tt"><span>&nbsp;&nbsp;${i[1]} x ${n3(i[2])}</span><span>${rr(i[1]*i[2])}</span></div>`).join('')}<div class="ln"></div><div>Total QTY : ${tq}</div><div class="tt" style="margin-top:12px"><span>Sub Total</span><span>${rr(s.total)}</span></div><div class="tt rt"><b>Total</b><b>${rr(s.total)}</b></div><div class="tt"><span>Bayar (Cash)</span><span>${rr(s.cash)}</span></div><div class="tt"><span>Kembali</span><span>${rr(s.cash-s.total)}</span></div><p class="c" style="margin:18px 0 0">Terima kasih telah berbelanja</p></div><div class="row np"><button class="bt" data-a="prn">Cetak struk</button><button class="bt gh" data-a="x">Tutup</button></div>`)}
function prod(){const L=[...S.p].sort((a,b)=>a.name.localeCompare(b.name));
const hd=sel?`<div class="tb"><h2 style="margin:0;margin-right:auto">${sel.size} dipilih</h2><button class="bt sm gh" data-a="sa">${sel.size==L.length?'Lepas semua':'Pilih semua'}</button><button class="bt sm gh" data-a="sx">Batal</button></div>`:`<div class="tb"><h2 style="margin:0;margin-right:auto">Barang</h2>${L.length?'<button class="bt sm gh" data-a="sm">Pilih</button>':''}<button class="bt sm sf" data-a="np">Tambah barang</button></div>`;
$('#v-prod').innerHTML=hd+(L.length?L.map(p=>sel?`<button class="li${sel.has(p.id)?' on':''}" data-a="tg" data-i="${p.id}"><span class="ck">${sel.has(p.id)?'✓':''}</span><span style="flex:1"><b>${esc(p.name)}</b><small>Stok ${p.stock}, jual ${rp(p.sell)}</small></span></button>`:`<button class="li" data-a="ep" data-i="${p.id}"><span><b>${esc(p.name)}</b><small>Jual ${rp(p.sell)}, beli ${rp(p.buy)}</small></span><span class="tg ${p.stock<1?'r':p.stock<=5?'w':''}">${p.stock<1?'Habis':'Stok '+p.stock}</span></button>`).join(''):'<div class="em">Belum ada barang. Ketuk Tambah barang untuk mulai.</div>')+(sel&&sel.size?`<button class="bt rd" data-a="ds" style="position:sticky;bottom:6px">Hapus ${sel.size} barang</button>`:'')}
function pf(id){const p=id?P(id):{};openM(`<h3>${id?'Ubah barang':'Tambah barang'}</h3><label for="f1">Nama barang</label><input id="f1" value="${esc(p.name||'')}"><label for="f2">Barcode (opsional)</label><div class="row"><input id="f2" value="${esc(p.bc||'')}">${A?'<button class="bt sm gh" style="margin:0" data-a="scan">Scan</button>':''}</div><div class="row"><div><label for="f3">Harga beli</label><input id="f3" inputmode="numeric" value="${p.buy??''}"></div><div><label for="f4">Harga jual</label><input id="f4" inputmode="numeric" value="${p.sell??''}"></div></div><label for="f5">Stok</label><input id="f5" inputmode="numeric" value="${p.stock??''}"><button class="bt sf" data-a="sp" data-i="${id||''}">Simpan barang</button>${id?`<button class="bt gh dn" data-a="dp" data-i="${id}">Hapus barang</button>`:''}`)}
function sp(id){const n=$('#f1').value.trim(),bc=$('#f2').value.trim(),buy=num('#f3'),sell=num('#f4'),st=num('#f5');if(!n)return toast('Isi nama barang');if(!sell)return toast('Isi harga jual');if(bc&&S.p.some(p=>p.bc==bc&&p.id!=id))return toast('Barcode sudah dipakai barang lain');
if(id){Object.assign(P(id),{name:n,bc,buy,sell,stock:st})}else S.p.push({id:Math.max(0,...S.p.map(p=>p.id))+1,name:n,bc,buy,sell,stock:st});save();closeM();prod();toast('Barang disimpan')}
function hist(){const L=[...S.s].reverse().slice(0,100);$('#v-hist').innerHTML='<h2>Riwayat transaksi</h2>'+(L.length?L.map(s=>`<button class="li" data-a="rc" data-id="${s.id}"><span><b>${s.id}</b><small>${new Date(s.t).toLocaleString('id-ID')}</small></span><b>${rp(s.total)}</b></button>`).join(''):'<div class="em">Belum ada transaksi. Mulai dari menu Kasir.</div>')}
function cfg(){$('#v-cfg').innerHTML=`<h2>Konfigurasi</h2><div class="cd"><h3>Logo toko</h3><div class="tb"><div class="av lp">${S.cfg.logo?'<img alt="" src="'+S.cfg.logo+'">':esc(S.cfg.name.charAt(0).toUpperCase())}</div><div style="flex:1"><button class="bt sm" data-a="pl">Pilih logo</button>${S.cfg.logo?'<button class="bt sm gh" style="margin-top:8px" data-a="dl">Hapus logo</button>':''}</div></div><input id="lf" type="file" accept="image/*" hidden></div><div class="cd"><h3>Profil toko</h3><label for="c1">Nama toko</label><input id="c1" maxlength="40" value="${esc(S.cfg.name)}"><label for="c5">Alamat (tampil di struk)</label><input id="c5" maxlength="120" value="${esc(S.cfg.addr||'')}"><label for="c6">No. telepon (tampil di struk)</label><input id="c6" inputmode="tel" maxlength="20" value="${esc(S.cfg.tel||'')}"><button class="bt" data-a="sn">Simpan profil toko</button></div><div class="cd"><h3>Ganti password</h3><label for="c2">Password lama</label><input id="c2" type="password" autocomplete="current-password"><label for="c3">Password baru</label><input id="c3" type="password" autocomplete="new-password"><label for="c4">Konfirmasi password baru</label><input id="c4" type="password" autocomplete="new-password"><button class="bt" data-a="sw">Simpan password</button></div><div class="cd"><h3>Penyimpanan</h3><p class="mu" style="margin:0">Semua data tersimpan di penyimpanan internal HP ini (di dalam browser), tanpa server dan tanpa internet. Data hilang jika data browser dibersihkan, jadi selalu buka aplikasi dari browser yang sama.</p></div><button class="bt gh" data-a="lock">Kunci aplikasi</button>`;$('#lf').onchange=logoUp}
async function sw(){try{const o=$('#c2').value,n=$('#c3').value;if(await hp(o,S.cfg.s)!==S.cfg.h)return toast('Password lama salah');if(n.length<6)return toast('Password baru minimal 6 karakter');if(n!==$('#c4').value)return toast('Konfirmasi password tidak sama');const s=rnd();S.cfg.s=s;S.cfg.h=await hp(n,s);save();['#c2','#c3','#c4'].forEach(i=>$(i).value='');toast('Password diganti')}catch(e){toast('Gagal mengganti password')}}
function logoUp(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,256/Math.max(im.width,im.height));c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.cfg.logo=c.toDataURL('image/webp',.9);save();hdr();cfg();toast('Logo toko diganti')};im.onerror=()=>toast('File bukan gambar yang valid');im.src=r.result};r.readAsDataURL(f)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=+b.dataset.i;
if(a=='go')go(b.dataset.t);else if(a=='add')add(i);else if(a=='cart')cartM();
else if(a=='inc'||a=='dec'){const c=cart.find(x=>x.id==i);if(a=='inc'){if(c.q>=P(i).stock)return toast('Stok tidak cukup');c.q++}else if(--c.q<1)cart=cart.filter(x=>x!==c);cart.length?cartM():closeM();bar()}
else if(a=='qk'){$('#cash').value=(+b.dataset.v).toLocaleString('id-ID');chg()}else if(a=='pay')pay();else if(a=='x')closeM();
else if(a=='prn'){A&&A.print?A.print():print()}else if(a=='scan'){A&&A.scan()}else if(a=='np')pf();else if(a=='ep')pf(i);else if(a=='sp')sp(i);
else if(a=='dp'){if(!b.dataset.c){b.dataset.c=1;b.textContent='Tekan lagi untuk menghapus';return}S.p=S.p.filter(p=>p.id!=i);cart=cart.filter(c=>c.id!=i);save();closeM();prod();toast('Barang dihapus')}
else if(a=='rc')rcpt(S.s.find(x=>x.id==b.dataset.id));
else if(a=='sm'){sel=new Set();prod()}else if(a=='sx'){sel=null;prod()}else if(a=='sa'){sel=sel.size==S.p.length?new Set():new Set(S.p.map(p=>p.id));prod()}else if(a=='tg'){sel.has(i)?sel.delete(i):sel.add(i);prod()}
else if(a=='ds'){if(!b.dataset.c){b.dataset.c=1;b.textContent='Tekan lagi untuk menghapus '+sel.size+' barang';return}const k=sel.size;S.p=S.p.filter(p=>!sel.has(p.id));cart=cart.filter(c=>P(c.id));sel=null;save();prod();toast(k+' barang dihapus')}
else if(a=='pl')$('#lf').click();else if(a=='dl'){delete S.cfg.logo;save();hdr();cfg();toast('Logo dihapus')}
else if(a=='sn'){const n=$('#c1').value.trim();if(n.length<2)return toast('Nama toko minimal 2 karakter');S.cfg.name=n;S.cfg.addr=$('#c5').value.trim();S.cfg.tel=$('#c6').value.trim();save();hdr();toast('Profil toko disimpan')}
else if(a=='sw')sw();else if(a=='lock')lock()});
const chg=()=>{$('#chg').textContent=rp(Math.max(num('#cash')-ctot(),0))};
document.addEventListener('input',e=>{if(e.target.id=='sq'){q=e.target.value;grid()}if(e.target.id=='cash'){const n=num('#cash');e.target.value=n?n.toLocaleString('id-ID'):'';chg()}});
$('#md').onclick=e=>{if(e.target.id=='md')closeM()};
window.__onScan=c=>{const f=$('#f2');if(f&&$('#md').classList.contains('on')){f.value=c;return}const p=S.p.find(x=>x.bc==c);p?add(p.id):toast('Barcode '+c+' belum terdaftar')};
try{S=JSON.parse(localStorage.getItem(K));if(!S||!S.cfg)S=null}catch(e){S=null}authUI();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js')}catch(e){}
</script></body></html>
