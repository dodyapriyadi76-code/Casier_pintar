<script>
const $=s=>document.querySelector(s),rp=n=>(n<0?'-':'')+'Rp'+Math.round(Math.abs(n)).toLocaleString('id-ID'),K='kasirpintar.v1';
let S,C=[];

function toast(m){const t=$('#ts');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2200)}

function seed(){let r=7;const R=()=>(r=(r*16807)%2147483647)/2147483647;
const L=[["Beras Premium 5 kg","Pokok",62000,69000],["Minyak Goreng 1 L","Pokok",16500,18500],["Gula Pasir 1 kg","Pokok",15000,17000],["Telur Ayam 1 kg","Pokok",26000,29000],["Mi Instan Goreng","Makanan",2900,3500],["Kopi Sachet","Minuman",1300,1800],["Teh Celup 25 s","Minuman",5500,7000],["Susu UHT 1 L","Minuman",15500,18000],["Air Mineral 600 ml","Minuman",2300,3500],["Sabun Mandi","Perawatan",3200,4500],["Sampo 170 ml","Perawatan",15000,19000],["Pasta Gigi 150 g","Perawatan",9000,12000],["Deterjen 800 g","Rumah Tangga",14500,17500],["Tisu Wajah","Rumah Tangga",8500,11000],["Biskuit Kelapa","Makanan",7000,9000],["Keripik Kentang","Makanan",9500,12500],["Cokelat Batang","Makanan",8000,11000],["Roti Tawar","Makanan",12000,15000],["Kecap Manis 275 ml","Pokok",9500,12000],["Saus Sambal 340 ml","Pokok",8000,10500],["Sarden Kaleng","Makanan",9500,12500],["Minuman Isotonik","Minuman",5000,7500],["Sabun Cuci Piring","Rumah Tangga",9000,12000],["Baterai AA (2 pcs)","Rumah Tangga",9000,13000]];
const p=L.map((l,i)=>({id:i+1,bc:'8991000'+String(100001+i),name:l[0],cat:l[1],buy:l[2],sell:l[3],stock:30+Math.floor(R()*90),min:15}));
const s=[],now=new Date();let n=1;
for(let d=13;d>=0;d--){const cnt=d?28+Math.floor(R()*22):12;for(let j=0;j<cnt;j++){const dt=new Date(now.getFullYear(),now.getMonth(),now.getDate()-d);const H=[7,8,9,12,13,17,18,19,20][Math.floor(R()*9)]+(R()<.3?1:0);if(!d&&H>now.getHours())continue;dt.setHours(Math.min(H,22),Math.floor(R()*60));
const ids=new Set();const k=1+Math.floor(R()*4);while(ids.size<k)ids.add(Math.floor(Math.pow(R(),1.7)*p.length)+1);if(ids.has(5)&&R()<.6)ids.add(4);if(ids.has(6)&&R()<.5)ids.add(3);
const it=[...ids].map(id=>{const q=1+Math.floor(R()*3),x=p[id-1];return[id,q,x.buy,x.sell]});
const sub=it.reduce((a,i)=>a+i[1]*i[3],0),pr=it.reduce((a,i)=>a+i[1]*(i[3]-i[2]),0);
s.push({id:'TRX'+String(n++).padStart(5,'0'),t:dt.getTime(),it,sub,disc:0,tax:0,total:sub,profit:pr,pay:['Tunai','Tunai','QRIS','QRIS','Debit','Kartu Kredit'][Math.floor(R()*6)],cash:sub})}}
s.sort((a,b)=>a.t-b.t);return{p,s,n,h:[]}}
function load(){S={p:[],s:[],n:1,h:[]}}
function save(){window.cloudSave&&window.cloudSave()}
load();
function T(){const sub=C.reduce((a,c)=>a+c.q*P(c.id).sell,0),cost=C.reduce((a,c)=>a+c.q*P(c.id).buy,0),mb=$('#mb').checked,disc=Math.min(sub,(+$('#dc').value||0)+(mb?Math.round(sub*.03):0)),tax=$('#tx').checked?Math.round((sub-disc)*.11):0;return{sub,disc,tax,total:sub-disc+tax,profit:sub-disc-cost,mem:mb}}
function rg(){const q=$('#q').value.trim().toLowerCase();const l=S.p.filter(p=>!q||p.name.toLowerCase().includes(q)||p.bc.includes(q)||p.cat.toLowerCase().includes(q)).slice(0,60);
$('#pg').innerHTML=l.map(p=>`<button class="pc${p.stock<=0?' x':''}" data-id="${p.id}"><small>${p.cat}</small>${p.name}<br><b>${rp(p.sell)}</b><small>Stok ${p.stock}</small></button>`).join('')||'<p>Barang tidak ditemukan.</p>'}
function add(id){const p=P(id);if(!p||p.stock<=0)return toast('Stok barang habis');const c=C.find(x=>x.id==id);if((c?c.q:0)+1>p.stock)return toast('Jumlah melebihi stok tersedia');c?c.q++:C.push({id:p.id,q:1});beep();rc()}
function rc(){$('#cn').textContent=C.reduce((a,c)=>a+c.q,0);$('#ct').innerHTML=C.map(c=>{const p=P(c.id);return`<div class="it"><div>${p.name}<br><small style="color:var(--mu)">${rp(p.sell)}</small></div><div class="q"><button data-m="${c.id}">−</button><b>${c.q}</b><button data-a="${c.id}">+</button></div><b>${rp(c.q*p.sell)}</b></div>`}).join('')||'<p style="color:var(--mu)">Belum ada barang. Pindai barcode atau pilih barang.</p>';
const t=T();$('#tl').innerHTML=`<div class="tt"><span>Subtotal</span><span>${rp(t.sub)}</span></div><div class="tt"><span>Diskon</span><span>-${rp(t.disc)}</span></div><div class="tt"><span>PPN</span><span>${rp(t.tax)}</span></div><div class="tt big"><span>Total</span><span>${rp(t.total)}</span></div><div class="tt"><span>Kembalian</span><span>${$('#pm').value=='Tunai'?rp(Math.max(0,(+$('#cs').value||0)-t.total)):'-'}</span></div>`;
$('#qk').innerHTML=[t.total,50000,100000,200000].map((v,i)=>`<button class="b" data-cs="${v}">${i?rp(v):'Uang pas'}</button>`).join('');
$('#hl').innerHTML=S.h.length?'<h3>Transaksi Ditahan</h3>'+S.h.map((h,i)=>`<div class="row" style="margin-bottom:4px"><span>#${i+1} · ${h.reduce((a,c)=>a+c.q,0)} item</span><button class="b" data-rh="${i}">Panggil</button></div>`).join(''):''}
function reset(){C=[];$('#dc').value='';$('#cs').value='';$('#mb').checked=false;rc()}
function bayar(){if(!C.length)return toast('Keranjang masih kosong');const t=T(),m=$('#pm').value,cash=+$('#cs').value||0;if(m=='Tunai'&&cash<t.total)return toast('Uang yang diterima kurang');
const s={id:'TRX'+String(S.n++).padStart(5,'0'),t:Date.now(),it:C.map(c=>{const p=P(c.id);p.stock-=c.q;return[c.id,c.q,p.buy,p.sell]}),...t,pay:m,cash:m=='Tunai'?cash:t.total};S.s.push(s);save();reset();rg();struk(s)}
function struk(s){$('#mc').innerHTML=`<div style="text-align:center"><b>TOKO BINTANG SEMBAKO</b><br>${new Date(s.t).toLocaleString('id-ID')}<br>${s.id}</div><hr>${s.it.map(i=>`${P(i[0]).name}<br>&nbsp;${i[1]} x ${rp(i[3])}<span style="float:right">${rp(i[1]*i[3])}</span><br>`).join('')}<hr>Subtotal<span style="float:right">${rp(s.sub)}</span><br>Diskon<span style="float:right">-${rp(s.disc)}</span><br>PPN<span style="float:right">${rp(s.tax)}</span><br><b>Total<span style="float:right">${rp(s.total)}</span></b><br>${s.pay}<span style="float:right">${rp(s.cash)}</span><br>Kembali<span style="float:right">${rp(s.cash-s.total)}</span><hr><div style="text-align:center">Terima kasih atas kunjungan Anda</div><div class="row np" style="margin-top:10px"><button class="b p" onclick="print()">Cetak</button><button class="b" onclick="$('#md').classList.remove('on')">Tutup</button></div>`;$('#md').classList.add('on')}
function dash(){const n=+$('#rg').value,now=new Date(),from=new Date(now.getFullYear(),now.getMonth(),now.getDate()-n+1).getTime(),ss=S.s.filter(s=>s.t>=from),days=[];
for(let i=n-1;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);days.push({k:dk(d),l:d.toLocaleDateString('id-ID',{day:'numeric',month:'short'}),r:0,p:0})}
const dm=Object.fromEntries(days.map(d=>[d.k,d]));let rev=0,pf=0;const pm={},pr={},hr=Array(24).fill(0),pair={},ct={};
ss.forEach(s=>{const d=dm[dk(s.t)];d.r+=s.total;d.p+=s.profit;rev+=s.total;pf+=s.profit;pm[s.pay]=(pm[s.pay]||0)+s.total;hr[new Date(s.t).getHours()]++;
s.it.forEach(([id,q,b,h])=>{const o=pr[id]||(pr[id]={q:0,r:0,p:0});o.q+=q;o.r+=q*h;o.p+=q*(h-b);const c=P(id).cat,x=ct[c]||(ct[c]={r:0,p:0});x.r+=q*h;x.p+=q*(h-b)});
const ids=s.it.map(i=>i[0]);for(let a=0;a<ids.length;a++)for(let b=a+1;b<ids.length;b++){const k=[ids[a],ids[b]].sort((x,y)=>x-y).join('|');pair[k]=(pair[k]||0)+1}});
$('#kp').innerHTML=[['Pendapatan',rp(rev)],['Laba Bersih',rp(pf)],['Margin',(rev?pf/rev*100:0).toFixed(1)+'%'],['Transaksi',ss.length],['Rata-rata Keranjang',rp(ss.length?rev/ss.length:0)]].map(a=>`<div class="c"><small>${a[0]}</small><b>${a[1]}</b></div>`).join('');

const top=Object.entries(pr).sort((a,b)=>b[1].q-a[1].q),tm=top[0]?top[0][1].q:1,tp=Object.entries(pr).sort((a,b)=>b[1].p-a[1].p);
const pk=hr.indexOf(Math.max(...hr)),ph=Math.max(...hr,1);
const ag=Object.fromEntries(Object.entries(pr).map(([k,v])=>[k,v.q/n]));
const rs=S.p.map(p=>({p,a:ag[p.id]||0})).filter(x=>x.p.stock<=x.p.min||(x.a&&x.p.stock/x.a<5)).sort((a,b)=>a.p.stock-b.p.stock);
const pairs=Object.entries(pair).sort((a,b)=>b[1]-a[1]).slice(0,3),slow=S.p.filter(p=>!pr[p.id]);
const cs=Object.entries(ct).map(([k,v])=>[k,v.p/v.r*100,v.r]).sort((a,b)=>b[1]-a[1]);
const lb=top.length?top[0]:null;
$('#ds').innerHTML=`<div class="c" style="grid-column:1/-1"><h3>Pendapatan dan Laba Harian <small style="color:var(--mu)">(terang: pendapatan, pekat: laba)</small></h3>${svg}</div>
<div class="c"><h3>Barang Terlaris (jumlah terjual)</h3>${top.slice(0,8).map(([id,o])=>`<div style="margin:7px 0"><div class="row"><span>${P(id).name}</span><span style="text-align:right;flex:0 0 auto">${o.q} pcs · ${rp(o.p)}</span></div><div class="bt"><div class="bar" style="width:${o.q/tm*100}%"></div></div></div>`).join('')||'Belum ada data.'}</div>
<div class="c"><h3>Penyumbang Laba Terbesar</h3><table>${tp.slice(0,6).map(([id,o])=>`<tr><td>${P(id).name}</td><td>${rp(o.p)}</td><td>${(o.p/o.r*100).toFixed(0)}%</td></tr>`).join('')}</table></div>
<div class="c"><h3>Jam Ramai Transaksi</h3><div class="hr">${hr.map((v,h)=>`<i title="${h}:00 — ${v} transaksi" style="height:${v/ph*100}%;opacity:${h==pk?1:.5}"></i>`).join('')}</div><small style="color:var(--mu)">Puncak keramaian pukul ${pk}:00–${pk+1}:00</small></div>
<div class="c"><h3>Metode Pembayaran</h3>${Object.entries(pm).map(([k,v])=>`<div style="margin:7px 0"><div class="row"><span>${k}</span><span style="text-align:right">${rp(v)} (${(v/rev*100).toFixed(0)}%)</span></div><div class="bt"><div class="bar" style="width:${v/rev*100}%"></div></div></div>`).join('')}</div>
<div class="c"><h3>Wawasan Otomatis</h3><ul class="in">${lb?`<li>Barang terlaris adalah <b>${P(lb[0]).name}</b> dengan ${lb[1].q} unit terjual.</li>`:''}<li>Jam tersibuk terjadi pukul <b>${pk}:00</b>; siapkan kasir tambahan pada jam tersebut.</li>${cs[0]?`<li>Kategori bermargin tertinggi: <b>${cs[0][0]}</b> (${cs[0][1].toFixed(1)}%); terendah: <b>${cs[cs.length-1][0]}</b> (${cs[cs.length-1][1].toFixed(1)}%).</li>`:''}${pairs.map(([k,v])=>{const [a,b]=k.split('|');return`<li>Sering dibeli bersamaan: <b>${P(a).name}</b> + <b>${P(b).name}</b> (${v}x). Pertimbangkan paket bundling.</li>`}).join('')}${slow.length?`<li>${slow.length} barang tidak terjual pada periode ini (mis. ${slow.slice(0,2).map(p=>p.name).join(', ')}).</li>`:''}</ul></div>
<div class="c"><h3>Peringatan Stok dan Saran Restock</h3><table>${rs.slice(0,8).map(x=>`<tr><td>${x.p.name}</td><td>Stok ${x.p.stock}</td><td><span class="tag ${x.p.stock<=x.p.min?'r':'w'}">${x.a?'±'+Math.floor(x.p.stock/x.a)+' hari':'Menipis'}</span></td></tr>`).join('')||'<tr><td>Seluruh stok dalam kondisi aman.</td></tr>'}</table></div>`}
function stok(){$('#st').innerHTML=`<table><tr><th>Barcode</th><th>Nama</th><th>Kategori</th><th>Beli</th><th>Jual</th><th>Margin</th><th>Stok</th><th>Tambah stok</th></tr>${S.p.map(p=>`<tr><td>${p.bc}</td><td>${p.name}</td><td>${p.cat}</td><td>${rp(p.buy)}</td><td>${rp(p.sell)}</td><td>${((p.sell-p.buy)/p.sell*100).toFixed(0)}%</td><td><span class="tag ${p.stock<=p.min?'r':''}">${p.stock}</span></td><td><div class="row"><input type="number" id="rs${p.id}" style="width:70px"><button class="b" data-rs="${p.id}">Tambah</button></div></td></tr>`).join('')}</table>`}
function his(){$('#hs').innerHTML=`<table><tr><th>No. Transaksi</th><th>Waktu</th><th>Item</th><th>Total</th><th>Laba</th><th>Metode</th><th></th></tr>${S.s.slice(-60).reverse().map(s=>`<tr><td>${s.id}</td><td>${new Date(s.t).toLocaleString('id-ID')}</td><td>${s.it.length}</td><td>${rp(s.total)}</td><td>${rp(s.profit)}</td><td>${s.pay}</td><td><button class="b" data-sv="${s.id}">Struk</button></td></tr>`).join('')}</table>`}
document.addEventListener('click',e=>{const t=e.target.closest('[data-id],[data-a],[data-m],[data-cs],[data-rh],[data-rs],[data-sv],[data-v]');if(!t)return;const D=t.dataset;
if(D.id)add(+D.id);else if(D.a)add(+D.a);else if(D.m){const c=C.find(x=>x.id==D.m);if(--c.q<=0)C=C.filter(x=>x!==c);rc()}else if(D.cs){$('#cs').value=D.cs;rc()}
else if(D.rh){C=S.h.splice(+D.rh,1)[0];save();rc()}else if(D.rs){const v=+$('#rs'+D.rs).value;if(v>0){P(D.rs).stock+=v;save();stok();toast('Stok diperbarui')}}
else if(D.sv)struk(S.s.find(s=>s.id==D.sv));else if(D.v){document.querySelectorAll('.v,#nv button').forEach(x=>x.classList.remove('on'));$('#'+D.v).classList.add('on');t.classList.add('on');({dash,stk:stok,his,pos:rg})[D.v]()}});
['dc','cs','mb','tx','pm'].forEach(i=>$('#'+i).addEventListener('input',rc));$('#rg').onchange=dash;$('#q').oninput=rg;
$('#q').addEventListener('keydown',e=>{if(e.key!='Enter')return;const v=e.target.value.trim(),m=S.p.filter(x=>x.name.toLowerCase().includes(v.toLowerCase())),p=S.p.find(x=>x.bc==v)||(m.length==1&&m[0]);if(p){add(p.id);e.target.value='';rg()}else toast(m.length?'Pilih barang dari daftar':'Barang tidak ditemukan')});
$('#by').onclick=bayar;$('#cl').onclick=reset;$('#hd').onclick=()=>{if(!C.length)return;S.h.push(C);save();reset();toast('Transaksi ditahan')};
addEventListener('keydown',e=>{if(e.key=='F2'){e.preventDefault();$('#q').focus()}if(e.key=='F9'){e.preventDefault();bayar()}if(e.key=='F8'){e.preventDefault();$('#hd').click()}});
$('#na').onclick=()=>{const v=i=>$('#n'+i).value.trim(),b=+v(4),h=+v(5);if(!v(1)||!v(2)||!h)return toast('Lengkapi barcode, nama, dan harga jual');if(S.p.some(p=>p.bc==v(1)))return toast('Barcode sudah terdaftar');S.p.push({id:Math.max(...S.p.map(p=>p.id))+1,bc:v(1),name:v(2),cat:v(3)||'Umum',buy:b,sell:h,stock:+v(6)||0,min:10});save();stok();[1,2,3,4,5,6].forEach(i=>$('#n'+i).value='');toast('Barang ditambahkan')};
$('#rs').onclick=()=>toast('Reset dinonaktifkan: data tersimpan di cloud');
$('#md').onclick=e=>{if(e.target.id=='md')$('#md').classList.remove('on')};
$('#cam').onclick=async()=>{const v=$('#vid');if(v.srcObject){v.srcObject.getTracks().forEach(t=>t.stop());v.srcObject=null;v.style.display='none';return}
if(!('BarcodeDetector' in window))return toast('Peramban ini belum mendukung pemindaian kamera');
try{const d=new BarcodeDetector(),s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=s;v.style.display='block';await v.play();
const loop=async()=>{if(!v.srcObject)return;try{const r=await d.detect(v);if(r[0]){const p=S.p.find(x=>x.bc==r[0].rawValue);p?add(p.id):toast('Barcode '+r[0].rawValue+' belum terdaftar');await new Promise(z=>setTimeout(z,1200))}}catch(e){}setTimeout(loop,300)};loop()}catch(e){toast('Kamera tidak dapat diakses')}};
setInterval(()=>$('#clk').textContent=new Date().toLocaleString('id-ID',{dateStyle:'full',timeStyle:'medium'}),1000);
$('#lb').onclick=()=>window.fbLogin($('#lu').value.trim(),$('#lp').value);
['lu','lp'].forEach(i=>$('#'+i).addEventListener('keydown',e=>{if(e.key=='Enter')$('#lb').click()}));
$('#lo').onclick=()=>window.fbLogout();
rg();rc();
</script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,collection,query,where,onSnapshot,writeBatch}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBFGfycyJCJxRvETiDrxpiLu3jdQmGi4zk",authDomain:"database-dody.firebaseapp.com",projectId:"database-dody",storageBucket:"database-dody.firebasestorage.app",messagingSenderId:"914851445929",appId:"1:914851445929:web:3a88344b6ec8d7539efdb8"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),mainRef=doc(db,'toko','main');
let unsubs=[],ready=false,synced=new Set();
const el=i=>document.getElementById(i),key=s=>s.id+'_'+s.t,enc=s=>({...s,it:JSON.stringify(s.it)}),dec=d=>({...d,it:JSON.parse(d.it)}),mainData=x=>({p:x.p,n:x.n,hj:JSON.stringify(x.h||[])});
function refresh(){const v=document.querySelector('.v.on'),m={pos:rg,dash,stk:stok,his};(m[v&&v.id]||rg)();rc()}
function fail(e){console.error(e);toast('Gagal menyimpan ke cloud. Periksa koneksi internet.')}
function stop(){unsubs.forEach(u=>u());unsubs=[];ready=false;synced=new Set()}
async function start(){
 el('le').textContent='Memuat data...';el('lb').disabled=true;
 try{
  const snap=await getDoc(mainRef);
  if(!snap.exists()){
   let init=null;try{init=JSON.parse(localStorage.getItem(K))}catch(e){}
   if(!init||!init.p)init=seed();
   await setDoc(mainRef,mainData(init));
   for(let i=0;i<init.s.length;i+=400){const b=writeBatch(db);init.s.slice(i,i+400).forEach(s=>b.set(doc(db,'trx',key(s)),enc(s)));await b.commit()}
   try{localStorage.removeItem(K)}catch(e){}
  }
  let first=true;
  unsubs.push(onSnapshot(mainRef,x=>{
   if(!x.exists()||x.metadata.hasPendingWrites)return;
   const d=x.data();S.p=d.p;S.n=d.n;S.h=JSON.parse(d.hj||'[]');
   if(first){first=false;ready=true;el('lg').classList.add('off');el('le').textContent='';el('lb').disabled=false}
   refresh()}));
  unsubs.push(onSnapshot(query(collection(db,'trx'),where('t','>=',Date.now()-40*864e5)),q=>{
   S.s=q.docs.map(x=>dec(x.data())).sort((a,b)=>a.t-b.t);q.docs.forEach(x=>synced.add(x.id));if(ready)refresh()}));
 }catch(e){console.error(e);el('le').textContent='Gagal memuat data. Periksa koneksi dan pengaturan Firebase.';el('lb').disabled=false}
}
window.cloudSave=()=>{
 if(!ready||!auth.currentUser)return;
 setDoc(mainRef,mainData(S)).catch(fail);
 S.s.forEach(s=>{const k=key(s);if(!synced.has(k)){synced.add(k);setDoc(doc(db,'trx',k),enc(s)).catch(e=>{synced.delete(k);fail(e)})}})
};
window.fbLogin=async(email,pass)=>{
 if(!email||!pass){el('le').textContent='Isi email dan kata sandi.';return}
 el('lb').disabled=true;el('le').textContent='Memeriksa...';
 try{await signInWithEmailAndPassword(auth,email,pass)}
 catch(e){el('lb').disabled=false;el('le').textContent=/network/.test(e.code)?'Tidak dapat terhubung ke internet.':/too-many/.test(e.code)?'Terlalu banyak percobaan. Coba lagi nanti.':'Email atau kata sandi tidak sesuai.'}
};
window.fbLogout=()=>signOut(auth);
onAuthStateChanged(auth,u=>{
 if(u){start();return}
 stop();S={p:[],s:[],n:1,h:[]};C=[];el('lu').value='';el('lp').value='';el('le').textContent='';el('lb').disabled=false;el('lg').classList.remove('off');refresh()
});
</script>
</body></html>
